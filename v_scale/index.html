<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Asteroid View</title>
  
  <!--  Simple reset to delete the margins  -->
  <style>
    body { margin: 0; }
    canvas { width: 100%; height: 100% }
    #controls { position: absolute; top: 10px; left: 10px; z-index: 10; }
    input { padding: 5px; }
  </style>
  
  <!--  Three.js CDN  -->
  <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r83/three.min.js"></script> -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@v0.149.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@v0.149.0/examples/jsm/"
      }
    }
    </script>
</head>

<body>
  <!--  Our code  -->
  <!-- creates an input for a number that is assigned to the speed variable -->
  <div id="controls">
    
    <!-- Set SEP and SSP point coordinates -->
    <input type="number" id="sep_x" value="4" step="0" style="display: none;">
    <input type="number" id="sep_y" value="0" step="0" style="display: none;">
    <input type="number" id="sep_z" value="0" step="0" style="display: none;">

    <input type="number" id="ssp_x" value="4" step="0" style="display: none;">
    <input type="number" id="ssp_y" value="0" step="0" style="display: none;">
    <input type="number" id="ssp_z" value="0" step="0" style="display: none;">
    
    <input type="number" id="pn" value="45" step="0" style="display: none;">

    <input type="number" id="b_a" value="0.9" step="0" style="display: none;">
    <input type="number" id="c_a" value="0.6" step="0" style="display: none;">
    <input type="text" id="obj_loc" value="1986_WD6_Durech.obj" style="display: none;">


  </div>
  <script type="module" src="app.js"></script>
</body>

</html>
